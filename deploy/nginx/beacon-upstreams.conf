# ⚠️ 本文件由 npm run proxy:sync 生成，来源 src/config/external.js，请勿手改。
# 用途：放在 nginx 的 http {} 块内（与其它 upstream / map 同级）。

upstream beacon_gitea {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream beacon_speedtest {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream beacon_probe {
    server 127.0.0.1:8082;
    keepalive 16;
}

# WebSocket 支持；若 http {} 里已有同名 map，删掉这段即可
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
