# ⚠️ 本文件由 npm run proxy:sync 生成，来源 src/config/external.js，请勿手改。
# 用途：include 进站点的 server {} 内，位置必须在 SPA 回退之前。
# 顺序说明：`location =` 精确匹配优先级最高，其次 `^~` 前缀匹配，最后才是 `location /`。

# Gitea → 127.0.0.1:3000
location = /gitea {
    return 301 /gitea/;
}

location ^~ /gitea/ {
    proxy_pass http://beacon_gitea;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}

# 若上游服务只能跑在根路径，把上面一行改成 proxy_pass http://beacon_gitea/;（带斜杠会剥掉前缀）

