# 若上游服务只能跑在根路径，把上面一行改成 proxy_pass http://beacon_probe/;（带斜杠会剥掉前缀）

# SPA 静态资源：命中不到就真 404，别回退成 HTML
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA 回退：其余路径（含前端路由 /luhn、/relay、未知路径）都交给 index.html
location / {
    try_files $uri $uri/ /index.html;
}
