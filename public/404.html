<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="5;url=/" />
    <title>404 · 页面不存在 | 115613.xyz</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #05070a;
        color: #dbe7f3;
        font-family: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: linear-gradient(#1a2533 0.5px, transparent 0.5px),
          linear-gradient(90deg, #1a2533 0.5px, transparent 0.5px);
        background-size: 48px 48px;
        opacity: 0.25;
        pointer-events: none;
      }
      .panel {
        position: relative;
        width: 100%;
        max-width: 520px;
        padding: 2.5rem 2rem;
        border: 1px solid rgba(56, 189, 248, 0.22);
        border-radius: 16px;
        background: rgba(9, 14, 22, 0.72);
        text-align: center;
      }
      .kicker {
        font-size: 0.68rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #5f7f9e;
      }
      .code {
        margin: 0.6rem 0 0.2rem;
        font-size: clamp(4.5rem, 20vw, 7rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.08em;
        color: #e8f4ff;
        text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
      }
      .title {
        font-size: 1rem;
        color: #9acdff;
        letter-spacing: 1px;
      }
      .desc {
        margin-top: 0.8rem;
        font-size: 0.82rem;
        line-height: 1.7;
        color: #6c86a3;
      }
      .actions {
        margin-top: 1.6rem;
      }
      .actions a {
        display: inline-block;
        padding: 0.55rem 1.2rem;
        border: 1px solid rgba(56, 189, 248, 0.28);
        border-radius: 40px;
        background: rgba(56, 189, 248, 0.16);
        color: #e8f4ff;
        font-size: 0.76rem;
        letter-spacing: 1px;
        text-decoration: none;
      }
      .actions a:hover {
        border-color: rgba(56, 189, 248, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="kicker">EDGE · ROUTE NOT FOUND</div>
      <div class="code">404</div>
      <div class="title">这条路径上没有灯</div>
      <p class="desc">请求的页面不存在。<br />5 秒后自动返回首页。</p>
      <div class="actions"><a href="/">返回首页</a></div>
    </div>
  </body>
</html>
